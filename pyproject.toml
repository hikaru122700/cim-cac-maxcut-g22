[project]
name = "cim-cac-maxcut-g22"
version = "0.1.0"
description = "Stanford G-Set / K2000 の MAX-CUT を CIM・CAC・SB・SA の 4 手法 (Python + Numba) で解いてベンチマーク比較するリポジトリ"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cloudscraper>=1.2.71",
    "matplotlib>=3.10.8",
    "numba>=0.65.0",
    "numpy>=2.4.4",
    "optuna>=4.0",
    "pymupdf>=1.27.2.2",
    "scipy>=1.17.1",
    "wandb>=0.25.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
